# Mapping Agent — SVG Workflow Diagram

```svg
<svg width="1600" height="1400" viewBox="0 0 1600 1400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font: bold 32px Arial; fill: #1f2937; }
