      .text { font: 18px Arial; fill: #111827; font-weight: 600; }
      .small { font: 15px Arial; fill: #374151; }
      .arrow { stroke: #374151; stroke-width: 3; marker-end: url(#arrowhead); }
      .legend { font: 16px Arial; fill: #111827; }
    </style>

    <marker id="arrowhead" markerWidth="10" markerHeight="7"
      refX="10" refY="3.5" orient="auto">
