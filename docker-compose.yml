services:

  # ── Postgres — platform database (STM sessions, catalog, pipeline state) ──
  platform-db:
    image: postgres:16-alpine
    container_name: sqlgen-platform-db
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB}
    volumes:
      - platform_db_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"   # host 5434 to avoid clash with demo-db on 5433
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    networks:
      - sqlgen-net

  # ── Postgres — demo source database (CRM/sales mock data) ────────────────
  demo-db:
    image: postgres:16-alpine
    container_name: sqlgen-demo-db
    restart: unless-stopped
    environment:
      POSTGRES_USER:     demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB:       crm_demo
    volumes:
      - demo_db_data:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "5433:5432"   # host 5433 to avoid clash with platform Postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d crm_demo"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    networks:
      - sqlgen-net

  # ── Python FastAPI — pipeline orchestrator ────────────────────────────────
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: sqlgen-api
    restart: unless-stopped
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@platform-db:5432/${POSTGRES_DB}
      - DEMO_DB_DSN=postgresql://demo:demo@demo-db:5432/crm_demo
      - GOOGLE_APPLICATION_CREDENTIALS=/secrets/gcpproject-438715-1815fb72089f.json
    volumes:
      - output_data:/app/output
      - ./gcp_json_key:/secrets:ro
    ports:
      - "8000:8000"
    depends_on:
      platform-db:
        condition: service_healthy
      demo-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - sqlgen-net

  # ── ZealPHP (OpenSwoole) — dashboard UI ─────────────────────────────────
  ui:
    build:
      context: .
      dockerfile: docker/Dockerfile.ui
    container_name: sqlgen-ui
    restart: unless-stopped
    environment:
      - API_BASE_URL=http://api:8000
      - API_BASE_URL_EXTERNAL=http://localhost:8000
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "$ctx=stream_context_create(['http'=>['timeout'=>3]]);$r=@file_get_contents('http://127.0.0.1:8080/',false,$ctx);exit($r===false?1:0);"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - sqlgen-net

volumes:
  output_data:
    driver: local
  platform_db_data:
    driver: local
  demo_db_data:
    driver: local

networks:
  sqlgen-net:
    driver: bridge
