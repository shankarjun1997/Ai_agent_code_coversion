services:

  # ── Postgres — demo source database (CRM/sales mock data) ────────────────
  demo-db:
    image: postgres:16-alpine
    container_name: sqlgen-demo-db
    restart: unless-stopped
    environment:
      POSTGRES_USER:     demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB:       crm_demo
    volumes:
      - demo_db_data:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "5433:5432"   # host 5433 to avoid clash with platform Postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d crm_demo"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    networks:
      - sqlgen-net

  # ── Python FastAPI — pipeline orchestrator ────────────────────────────────
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: sqlgen-api
    restart: unless-stopped
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
      - DEMO_DB_DSN=postgresql://demo:demo@demo-db:5432/crm_demo
    volumes:
      - output_data:/app/output
    ports:
      - "8000:8000"
    depends_on:
      demo-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - sqlgen-net

  # ── PHP + Nginx — dashboard UI ───────────────────────────────────────────
  ui:
    build:
      context: .
      dockerfile: docker/Dockerfile.ui
    container_name: sqlgen-ui
    restart: unless-stopped
    environment:
      - API_BASE_URL=http://api:8000
    volumes:
      - output_data:/app/output:ro   # read-only — UI only reads state
      - ./ui:/var/www/html           # live-reload for UI development
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - sqlgen-net

volumes:
  output_data:
    driver: local
  demo_db_data:
    driver: local

networks:
  sqlgen-net:
    driver: bridge
